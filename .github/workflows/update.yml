name: update

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Recompute both platform hashes even when already current
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencodex-update
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Prepare source update
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          ./scripts/prepare-update.sh
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "Forcing platform hash recomputation"
            python3 - <<'PY'
          import json
          p = "version.json"
          d = json.load(open(p))
          d["bunDepsHash"]["x86_64-linux"] = None
          d["bunDepsHash"]["aarch64-darwin"] = None
          with open(p, "w") as f:
              json.dump(d, f, indent=2)
              f.write("\n")
          PY
          fi
          MISSING_HASH="$(python3 -c '
          import json
          d = json.load(open("version.json"))
          platforms = ("x86_64-linux", "aarch64-darwin")
          print(str(any(d["bunDepsHash"].get(p) is None for p in platforms)).lower())
          ')"
          if git diff --quiet -- version.json bun.lock.normalized \
            && [[ "$MISSING_HASH" == "false" ]]; then
            echo "Already current; no update required"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update prepared"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: prepared-update
          path: |
            version.json
            bun.lock.normalized
          if-no-files-found: error
          retention-days: 1

  hashes:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prepared-update
          path: .
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: sandbox = false
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Compute and verify ${{ matrix.system }} hash
        run: ./scripts/update-platform.sh "${{ matrix.system }}"
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.system }}
          path: version.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [prepare, hashes]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prepared-update
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: metadata-x86_64-linux
          path: ${{ runner.temp }}/metadata-linux
      - uses: actions/download-artifact@v4
        with:
          name: metadata-aarch64-darwin
          path: ${{ runner.temp }}/metadata-darwin
      - name: Merge platform hashes
        run: |
          ./scripts/merge-platform-hashes.py \
            version.json \
            "$RUNNER_TEMP/metadata-linux/version.json" \
            "$RUNNER_TEMP/metadata-darwin/version.json"
      - name: Commit update
        id: commit
        run: |
          if git diff --quiet -- version.json bun.lock.normalized; then
            echo "Finalized metadata already matches the source revision"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json bun.lock.normalized
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          git commit -m "chore: refresh opencodex ${VERSION} build metadata"
          git push origin HEAD:bot/opencodex-update --force
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main bot/opencodex-update
          OLD_VERSION="$(git show origin/main:version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          NEW_VERSION="$(git show origin/bot/opencodex-update:version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [[ "$OLD_VERSION" != "$NEW_VERSION" ]]; then
            TITLE="chore: bump opencodex to ${NEW_VERSION}"
          else
            TITLE="chore: refresh opencodex build metadata (${NEW_VERSION})"
          fi
          BODY="Automated update of the pinned opencodex version/hashes by the daily update workflow.

          - Version: ${NEW_VERSION}
          - src hash and x86_64-linux / aarch64-darwin bunDeps hashes refreshed as needed
          - normalized bun.lock regenerated on version bumps

          CI (ci.yml) verifies the build on both platforms. Merge to publish."
          OPEN_PR_NUMBER="$(gh pr list \
            --base main \
            --head bot/opencodex-update \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$OPEN_PR_NUMBER" ]]; then
            echo "Updating open PR #${OPEN_PR_NUMBER}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${OPEN_PR_NUMBER}" \
              -f title="$TITLE" \
              -f body="$BODY" \
              >/dev/null
          else
            echo "Creating PR from bot/opencodex-update"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$TITLE" \
              -f head="bot/opencodex-update" \
              -f base="main" \
              -f body="$BODY" \
              --jq .html_url
          fi
